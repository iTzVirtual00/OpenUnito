[versions]
agp = "9.4.1"
coreSplashscreen = "1.2.0"
koin = "4.2.2"
koinAnnotations = "2.3.1"
kotlinxDatetime = "0.8.0"
navigation = "2.9.2"
junitVersion = "1.1.5"
kotlinxSerializationJson = "1.10.0"
activityCompose = "1.8.0"
kotlin = "2.3.20"
ksp = "2.3.6"
ktor = "3.1.1"
coreKtx = "1.17.0"
room3 = "3.0.3"
kotlinStdlib = "2.3.20"
kotlinTest = "2.3.20"
runner = "1.5.2"
core = "1.5.0"
coroutines = "1.11.0"
kermit = "2.2.0"

androidx-lifecycle = "2.11.0"
composeMultiplatform = "1.12.1"
material3 = "1.12.0-alpha03"
materialIconsExtended = "1.7.3"
atomicfu = "0.29.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koinAnnotations" }
koin-ksp-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koinAnnotations" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
