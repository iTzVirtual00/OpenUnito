name: Build, Sign and Deploy APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
      - name: Assemble Release APK
        run: ./gradlew --build-cache --configuration-cache :androidApp:assembleRelease -x lintVitalRelease

      - name: Sign app APK
        uses: ilharp/sign-android-release@v2
        id: sign_app
        with:
          releaseDir: androidApp/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Extract version from version.properties
        id: version
        run: |
          TAG=$(grep '^versionName=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: ${{ steps.sign_app.outputs.signedFile }}
          generate_release_notes: true