name: Build, Sign and Deploy APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
      - name: Assemble Release APK
        run: ./gradlew --build-cache --configuration-cache :androidApp:assembleRelease -x lintVitalRelease

      - name: Extract version from version.properties
        id: version
        run: |
          V_NAME=$(grep '^versionName=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          V_CODE=$(grep '^versionCode=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "tag=${V_NAME}+${V_CODE}" >> $GITHUB_OUTPUT
          echo "versionName=${V_NAME}" >> $GITHUB_OUTPUT

      - name: Rename Signed APK
        id: rename_apk
        run: |
          NEW_NAME="OpenUnito-${{ steps.version.outputs.versionName }}.apk"
          mv "${{ steps.sign_app.outputs.signedFile }}" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.versionName }}
          files: ${{ steps.rename_apk.outputs.apk_path }}
          generate_release_notes: false