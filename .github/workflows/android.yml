name: Build, Sign and Deploy APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
          
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
      - name: Assemble Release APK
        run: ./gradlew --configuration-cache assembleRelease
        
      - name: Sign app APK
        uses: ilharp/sign-android-release@v2
        id: sign_app
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 36.0.0
      - name: Upload Signed APK
        env:
          JSON_PATH: "app/release/version.json"
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_AUTH: ${{ secrets.UPLOAD_AUTH }}
        run: |
          chmod +x .github/deploy.sh
          echo ./.github/deploy.sh "$UPLOAD_URL" "$UPLOAD_TOKEN" "$ANDROID_SIGNED_FILE" "$JSON_PATH"
          ./.github/deploy.sh "$UPLOAD_URL" "$UPLOAD_TOKEN" "$ANDROID_SIGNED_FILE" "$JSON_PATH"
          rm -f /tmp/upload.sh
