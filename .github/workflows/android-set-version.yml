name: Set Version

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version Code'
        required: false
        type: string
      versionName:
        description: 'Version Name'
        required: false
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Resolve and Update version.properties
        id: version
        env:
          INPUT_VERSION_CODE: ${{ inputs.versionCode }}
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
        run: |
          echo "::group::Debug - Step Inputs"
          echo "INPUT_VERSION_CODE='${INPUT_VERSION_CODE}'"
          echo "INPUT_VERSION_NAME='${INPUT_VERSION_NAME}'"
          echo "::endgroup::"

          CURRENT_CODE="1"
          CURRENT_NAME="v0.0.1"

          if [ -f version.properties ]; then
            echo "::group::Debug - Existing version.properties"
            cat version.properties
            echo "::endgroup::"

            CURRENT_CODE=$(grep -E '^versionCode=' version.properties | cut -d'=' -f2- | tr -d '[:space:]')
            CURRENT_NAME=$(grep -E '^versionName=' version.properties | cut -d'=' -f2- | tr -d '[:space:]')
          else
            echo "version.properties not found. Using defaults."
          fi

          echo "::group::Debug - Parsed Current Values"
          echo "CURRENT_CODE='${CURRENT_CODE}'"
          echo "CURRENT_NAME='${CURRENT_NAME}'"
          echo "::endgroup::"

          # Resolve versionCode
          # Use input if not null or increment existing by one
          if [ -n "${INPUT_VERSION_CODE}" ]; then
            RESOLVED_CODE="${INPUT_VERSION_CODE}"
            echo "Using manual versionCode override: ${RESOLVED_CODE}"
          else
            RESOLVED_CODE=$(( ${CURRENT_CODE:-0} + 1 ))
            echo "Incremented versionCode from '${CURRENT_CODE:-0}' to '${RESOLVED_CODE}'"
          fi

          # Resolve versionName
          # Use input or increment existing MINOR by one
          if [ -n "${INPUT_VERSION_NAME}" ]; then
            RESOLVED_NAME="${INPUT_VERSION_NAME}"
            echo "Using manual versionName override: ${RESOLVED_NAME}"
          else
            # Parses optional 'v' followed by MAJOR.MINOR.PATCH
            REGEX="^(v?)([0-9]+)\.([0-9]+)\.([0-9]+)$"
            if [[ "${CURRENT_NAME}" =~ $REGEX ]]; then
              PREFIX="${BASH_REMATCH[1]}"
              MAJOR="${BASH_REMATCH[2]}"
              MINOR="${BASH_REMATCH[3]}"
              PATCH="${BASH_REMATCH[4]}"
              NEW_PATCH=$(( PATCH + 1 ))
              RESOLVED_NAME="${PREFIX}${MAJOR}.${MINOR}.${NEW_PATCH}"
              echo "Incremented PATCH version: ${CURRENT_NAME} -> ${RESOLVED_NAME}"
            else
              echo "WARNING: '${CURRENT_NAME}' did not match regex '${REGEX}'. Keeping original."
              RESOLVED_NAME="${CURRENT_NAME}"
            fi
          fi

          # Write to file
          cat <<EOF > version.properties
          versionCode=${RESOLVED_CODE}
          versionName=${RESOLVED_NAME}
          EOF

          # Set outputs for downstream steps
          echo "versionCode=${RESOLVED_CODE}" >> "$GITHUB_OUTPUT"
          echo "versionName=${RESOLVED_NAME}" >> "$GITHUB_OUTPUT"

          echo "::group::Debug - Final Outputs Written"
          echo "versionCode=${RESOLVED_CODE}"
          echo "versionName=${RESOLVED_NAME}"
          echo "::endgroup::"

      - name: Commit, Tag, and Push
        env:
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version.properties
          git commit -m "bump to ${VERSION_NAME}+${VERSION_CODE}"

          TAG_NAME="${VERSION_NAME}+${VERSION_CODE}"
          TAG_MESSAGE="Release ${VERSION_NAME} (build ${VERSION_CODE})"
          git tag -a "${TAG_NAME}" -m "${TAG_MESSAGE}"

          git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/${TAG_NAME}"
