name: Set Version

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version Code'
        required: true
        type: string
      versionName:
        description: 'Version Name'
        required: true
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit, push branch, and create tags

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use current branch/ref that triggered the workflow
          ref: ${{ github.ref }}

      - name: Write version.properties
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          cat <<EOF > version.properties
          versionCode=${VERSION_CODE}
          versionName=${VERSION_NAME}
          EOF

      - name: Commit, Tag, and Push
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage file
          git add version.properties

          # Commit
          git commit -m "bump to ${VERSION_CODE}+${VERSION_NAME}"

          # Push the commit to the current branch
          git push origin HEAD:${{ github.ref_name }}

          # Create annotated tag
          TAG_NAME="${VERSION_NAME}+${VERSION_CODE}"
          TAG_MESSAGE="Release ${VERSION_NAME} (build ${VERSION_CODE})"
          git tag -a "${TAG_NAME}" -m "${TAG_MESSAGE}"

          # Push tag
          git push origin "${TAG_NAME}"
