name: Set Version

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version Code'
        required: true
        default: "1"
        type: string
      versionName:
        description: 'Version Name'
        required: true
        default: "v0.0.1"
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Write version.properties
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          cat <<EOF > version.properties
          versionCode=${VERSION_CODE}
          versionName=${VERSION_NAME}
          EOF

      - name: Commit, Tag, and Push
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version.properties
          git commit -m "bump to ${VERSION_CODE}+${VERSION_NAME}"

          TAG_NAME="${VERSION_NAME}+${VERSION_CODE}"
          TAG_MESSAGE="Release ${VERSION_NAME} (build ${VERSION_CODE})"
          git tag -a "${TAG_NAME}" -m "${TAG_MESSAGE}"

          git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/${TAG_NAME}"
